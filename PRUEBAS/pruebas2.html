<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Checkout - Demo</title>
<link rel="stylesheet" href="pruebas2.css" />
</head>
<body>
<main class="checkout">
<section class="checkout__form">
<h1>Finalizar compra</h1>


<form id="checkoutForm">
<fieldset>
<legend>Contacto</legend>
<label>Email<input type="email" name="email" required /></label>
</fieldset>


<fieldset>
<legend>Dirección</legend>
<label>Nombre completo<input name="name" required /></label>
<label>Dirección<input name="address" required /></label>
<label>Ciudad<input name="city" required /></label>
<label>País<select name="country"><option>Guatemala</option><option>Otro</option></select></label>
</fieldset>


<fieldset>
<legend>Pago</legend>
<label>Tarjeta<input name="card" inputmode="numeric" maxlength="19" required /></label>
<div class="small-row">
<label>Exp<input name="exp" placeholder="MM/AA" required /></label>
<label>CVV<input name="cvv" maxlength="4" required /></label>
</div>
</fieldset>


<button type="submit" class="btn">Pagar ahora</button>
</form>
</section>


<aside class="checkout__summary">
<h2>Resumen del pedido</h2>
<div id="cartItems"></div>
<div class="totals">
<div>Subtotal <span id="subtotal">$0.00</span></div>
<div>Envío <span id="shipping">$5.00</span></div>
<div class="total">Total <strong id="total">$0.00</strong></div>
</div>
</aside>
</main>


<script src="checkout.js"></script>
</body>
</html>
